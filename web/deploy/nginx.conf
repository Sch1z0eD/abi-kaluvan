# Example nginx site for ABI Kaluvan web/ (put into /etc/nginx/sites-available/abi-kaluvan).
# certbot --nginx adds the HTTPS part (listen 443, certificates) to this block.
server {
    listen 80;
    server_name abi.example.com;

    root /var/www/abi-kaluvan;
    index index.html;

    # Keep the tool private
    auth_basic "ABI Kaluvan";
    auth_basic_user_file /etc/nginx/abi-kaluvan.htpasswd;

    location / {
        try_files $uri $uri/ =404;
        # the site and its sound library change with updates: browsers revalidate them (cheap, via ETag)
        add_header Cache-Control "no-cache";
    }

    # deployment notes are not part of the site
    location ~ ^/(deploy/|README\.md$) {
        return 404;
    }

    # Tesseract does not change between updates and is large: cache it
    location /lib/ {
        expires 30d;
    }

    gzip on;
    gzip_types application/javascript application/json text/css image/svg+xml audio/wav;
}
